title: Suspicious PowerShell Download Cradle
id: 12345678-abcd-efgh-ijkl-1234567890ab
status: experimental
description: Detects suspicious PowerShell download cradles commonly used to download and execute malicious payloads (e.g., IEX(New-Object Net.WebClient).DownloadString).
references:
    - https://attack.mitre.org/techniques/T1059/001/
author: Gurvin Singh
date: 2024-05-24
tags:
    - attack.execution
    - attack.t1059.001
logsource:
    product: windows
    category: process_creation
detection:
    selection:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains|all:
            - 'Net.WebClient'
            - 'DownloadString'
    condition: selection
falsepositives:
    - Legitimate administrative scripts downloading updates internally.
level: high
